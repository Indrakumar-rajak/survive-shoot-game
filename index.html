<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>60 Seconds - Survive Shoot</title>

<!-- YouTube Playables SDK MUST load before game code -->
<script src="https://www.youtube.com/game_api/v1"></script>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050816;
        font-family: Arial, sans-serif;
        touch-action: none;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #gameWrap {
        position: relative;
        width: min(100vw, 1000px);
        height: min(100vh, 650px);
        aspect-ratio: 1000 / 650;
        overflow: hidden;
        background: #050816;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        background:
            radial-gradient(circle at center, #101a35 0%, #050816 65%);
    }

    #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        z-index: 5;

        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        color: white;
        font-size: 16px;
        font-weight: bold;

        pointer-events: none;
        text-shadow: 0 2px 4px #000;
    }

    .hudBox {
        background: rgba(0, 0, 0, 0.35);
        padding: 7px 10px;
        border-radius: 8px;
        margin-bottom: 5px;
    }

    #powerText {
        color: #4db8ff;
    }

    #shieldText {
        color: #73f6ff;
    }

    #overlay {
        position: absolute;
        inset: 0;
        z-index: 10;

        display: none;
        align-items: center;
        justify-content: center;

        background: rgba(0, 0, 0, 0.72);
        color: white;
        text-align: center;
    }

    #overlay.show {
        display: flex;
    }

    #overlayContent {
        width: min(88%, 420px);
        padding: 28px 20px;
        border-radius: 18px;
        background: rgba(10, 17, 38, 0.96);
        border: 1px solid rgba(100, 180, 255, 0.35);
        box-shadow: 0 0 30px rgba(0, 120, 255, 0.2);
    }

    #overlayTitle {
        margin: 0 0 12px;
        font-size: 32px;
    }

    #finalScore {
        font-size: 22px;
        margin: 10px 0;
    }

    #bestScoreFinal {
        font-size: 18px;
        opacity: 0.9;
    }

    #restartBtn {
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        padding: 13px 25px;

        background: #1687ff;
        color: white;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;
    }

    #restartBtn:active {
        transform: scale(0.96);
    }

    #mobileControls {
        position: absolute;
        bottom: 15px;
        left: 15px;
        right: 15px;
        z-index: 7;

        display: flex;
        justify-content: space-between;

        pointer-events: none;
    }

    .controlBtn {
        width: 72px;
        height: 72px;

        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.25);

        background: rgba(20, 35, 70, 0.72);
        color: white;

        font-size: 30px;
        font-weight: bold;

        display: flex;
        align-items: center;
        justify-content: center;

        user-select: none;
        pointer-events: auto;
    }

    .controlBtn:active {
        transform: scale(0.92);
        background: rgba(40, 90, 150, 0.85);
    }

    @media (min-width: 800px) {
        #mobileControls {
            opacity: 0.35;
        }
    }
</style>
</head>

<body>

<div id="gameWrap">

    <canvas id="gameCanvas"
            width="1000"
            height="650">
    </canvas>

    <div id="hud">

        <div>
            <div class="hudBox">
                SCORE: <span id="score">0</span>
            </div>

            <div class="hudBox">
                BEST: <span id="best">0</span>
            </div>
        </div>

        <div style="text-align:right;">
            <div class="hudBox">
                TIME: <span id="time">60</span>
            </div>

            <div class="hudBox">
                LIVES: <span id="lives">3</span>
            </div>

            <div class="hudBox" id="powerText">
                BULLETS: <span id="bulletPower">1</span>
            </div>

            <div class="hudBox" id="shieldText">
                SHIELD: <span id="shieldStatus">OFF</span>
            </div>
        </div>

    </div>

    <div id="mobileControls">
        <div class="controlBtn" id="leftBtn">◀</div>
        <div class="controlBtn" id="rightBtn">▶</div>
    </div>

    <div id="overlay">

        <div id="overlayContent">

            <h1 id="overlayTitle">
                GAME OVER
            </h1>

            <div id="finalScore">
                SCORE: 0
            </div>

            <div id="bestScoreFinal">
                BEST: 0
            </div>

            <button id="restartBtn">
                PLAY AGAIN
            </button>

        </div>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;


/* =========================================================
   UI
========================================================= */

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const timeEl = document.getElementById("time");
const livesEl = document.getElementById("lives");
const bulletPowerEl = document.getElementById("bulletPower");
const shieldStatusEl = document.getElementById("shieldStatus");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const finalScoreEl = document.getElementById("finalScore");
const bestScoreFinalEl = document.getElementById("bestScoreFinal");
const restartBtn = document.getElementById("restartBtn");


/* =========================================================
   PLAYABLES STATE
========================================================= */

let ytPaused = false;
let playablesReady = false;

let cloudSaveLoaded = false;
let cloudSavePending = false;
let scoreSentThisRun = false;


/* =========================================================
   SAFE LOCAL STORAGE
========================================================= */

function getLocalBestScore() {

    try {

        const value =
            Number(localStorage.getItem("surviveShootBest") || 0);

        if (!Number.isFinite(value) || value < 0) {
            return 0;
        }

        return Math.floor(value);

    } catch (error) {

        console.log("LocalStorage read error:", error);

        return 0;
    }
}


function saveLocalBestScore(value) {

    try {

        localStorage.setItem(
            "surviveShootBest",
            String(Math.floor(value))
        );

    } catch (error) {

        console.log("LocalStorage write error:", error);
    }
}


/* =========================================================
   GAME VARIABLES
========================================================= */

let player;

let bullets = [];
let obstacles = [];
let particles = [];
let powerUps = [];

let score = 0;
let best = getLocalBestScore();

let lives = 3;

let gameTime = 60;
let gameRunning = true;

let combo = 0;

let bulletsPower = 1;
let bulletsPowerTimer = 0;

let shieldActive = false;
let shieldTimer = 0;

let shootTimer = 0.34;

let obstacleTimer = 0;

let lastTime = performance.now();

let keys = {
    left: false,
    right: false
};


/* =========================================================
   PLAYER
========================================================= */

function createPlayer() {

    return {
        x: W / 2,
        y: H - 75,

        width: 46,
        height: 34,

        speed: 520,

        invincibleTimer: 0
    };
}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    player = createPlayer();

    bullets = [];
    obstacles = [];
    particles = [];
    powerUps = [];

    score = 0;

    lives = 3;

    gameTime = 60;

    combo = 0;

    bulletsPower = 1;
    bulletsPowerTimer = 0;

    shieldActive = false;
    shieldTimer = 0;

    shootTimer = 0.34;

    obstacleTimer = 0;

    gameRunning = true;

    scoreSentThisRun = false;

    overlay.classList.remove("show");

    updateHUD();
}


/* =========================================================
   CLOUD SAVE
========================================================= */

/*
    Only a very small object is saved.

    Example:
    {"bestScore":1234}

    This is far below the 3 MiB Playables limit.
*/

function makeCloudSaveData() {

    const safeBest =
        Math.max(
            0,
            Math.floor(
                Number.isFinite(best) ? best : 0
            )
        );

    return JSON.stringify({
        bestScore: safeBest
    });
}


/*
    Save data to YouTube Playables cloud storage.
*/

async function saveCloudData() {

    if (
        typeof ytgame === "undefined" ||
        !ytgame.game ||
        typeof ytgame.game.saveData !== "function"
    ) {
        return;
    }

    if (cloudSavePending) {
        return;
    }

    cloudSavePending = true;

    try {

        const data = makeCloudSaveData();

        /*
            Keep this check as an additional safety measure.
            Our actual data is only a few bytes.
        */

        if (
            typeof String.prototype.isWellFormed === "function" &&
            !data.isWellFormed()
        ) {
            console.log("Cloud save string is not well formed.");
            return;
        }

        await ytgame.game.saveData(data);

        console.log(
            "Cloud save successful:",
            data
        );

    } catch (error) {

        console.log(
            "Cloud save error:",
            error
        );

    } finally {

        cloudSavePending = false;
    }
}


/*
    Load best score from YouTube cloud storage.

    Local score is kept as fallback.
*/

async function loadCloudData() {

    if (
        typeof ytgame === "undefined" ||
        !ytgame.game ||
        typeof ytgame.game.loadData !== "function"
    ) {
        return;
    }

    try {

        const data =
            await ytgame.game.loadData();

        if (
            typeof data === "string" &&
            data.length > 0
        ) {

            const parsed =
                JSON.parse(data);

            const cloudBest =
                Number(parsed.bestScore);

            if (
                Number.isFinite(cloudBest) &&
                cloudBest >= 0
            ) {

                best =
                    Math.max(
                        best,
                        Math.floor(cloudBest)
                    );

                saveLocalBestScore(best);

                updateHUD();

                console.log(
                    "Cloud best loaded:",
                    best
                );
            }
        }

        cloudSaveLoaded = true;

    } catch (error) {

        /*
            A first-time player may have no cloud data.
            That should not stop the game.
        */

        cloudSaveLoaded = true;

        console.log(
            "Cloud load unavailable:",
            error
        );
    }
}


/* =========================================================
   SEND SCORE
========================================================= */

async function sendFinalScore() {

    if (scoreSentThisRun) {
        return;
    }

    scoreSentThisRun = true;

    /*
        Playables requires the score value to be an integer.
    */

    const finalIntegerScore =
        Math.floor(
            Math.max(
                0,
                Number.isFinite(score) ? score : 0
            )
        );

    if (
        typeof ytgame === "undefined" ||
        !ytgame.engagement ||
        typeof ytgame.engagement.sendScore !== "function"
    ) {

        console.log(
            "sendScore unavailable outside Playables."
        );

        return;
    }

    try {

        await ytgame.engagement.sendScore({
            value: finalIntegerScore
        });

        console.log(
            "Score sent:",
            finalIntegerScore
        );

    } catch (error) {

        console.log(
            "sendScore error:",
            error
        );
    }
}


/* =========================================================
   PLAYABLES SETUP
========================================================= */

function setupPlayables() {

    if (
        typeof ytgame === "undefined" ||
        !ytgame.system
    ) {

        console.log(
            "Playables SDK not available."
        );

        return;
    }


    /*
        YouTube pauses the game.
    */

    if (
        typeof ytgame.system.onPause === "function"
    ) {

        ytgame.system.onPause(() => {

            ytPaused = true;

            /*
                Save quickly because YouTube gives
                the game a short window during pause.
            */

            saveCloudData();
        });
    }


    /*
        YouTube resumes the game.
    */

    if (
        typeof ytgame.system.onResume === "function"
    ) {

        ytgame.system.onResume(() => {

            ytPaused = false;

            lastTime = performance.now();
        });
    }
}


/* =========================================================
   PLAYABLES READY
========================================================= */

function notifyPlayablesReady() {

    if (playablesReady) {
        return;
    }

    if (
        typeof ytgame === "undefined" ||
        !ytgame.game
    ) {

        console.log(
            "Playables SDK not available."
        );

        return;
    }

    try {

        /*
            REQUIRED ORDER:
            firstFrameReady()
            THEN
            gameReady()
        */

        ytgame.game.firstFrameReady();

        ytgame.game.gameReady();

        playablesReady = true;

        console.log(
            "Playables: firstFrameReady + gameReady"
        );

    } catch (error) {

        console.log(
            "Playables readiness error:",
            error
        );
    }
}


/* =========================================================
   SHOOTING
   ORIGINAL SHOOTING MECHANIC PRESERVED
========================================================= */

function shoot() {

    if (bulletsPower === 1) {

        bullets.push({
            x: player.x,
            y: player.y - 22,
            vx: 0,
            vy: -720
        });

        return;
    }


    let spread;

    if (bulletsPower === 2) {

        spread = 70;

    } else if (bulletsPower === 3) {

        spread = 90;

    } else {

        spread = 105;
    }


    const count = bulletsPower;

    for (let i = 0; i < count; i++) {

        const center =
            (count - 1) / 2;

        const vx =
            (i - center) * spread;

        bullets.push({

            x: player.x,
            y: player.y - 22,

            vx: vx,
            vy: -720
        });
    }
}


/* =========================================================
   SPAWN OBSTACLE
========================================================= */

function spawnObstacle() {

    const number =
        Math.floor(
            Math.random() * 5
        ) + 1;

    const size = 42;

    obstacles.push({

        x:
            Math.random() *
            (W - size),

        y: -size,

        width: size,
        height: size,

        hp: number,
        maxHp: number,

        speed:
            145 +
            Math.random() * 130
    });
}


/* =========================================================
   SPAWN POWER UP
========================================================= */

function spawnPowerUp() {

    const type =
        Math.random() < 0.72
            ? "bullet"
            : "shield";

    powerUps.push({

        x:
            35 +
            Math.random() *
            (W - 70),

        y: -25,

        size: 22,

        type: type,

        speed: 150
    });
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    amount = 10
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            70 +
            Math.random() *
            180;

        particles.push({

            x: x,
            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                0.35 +
                Math.random() *
                0.35
        });
    }
}


/* =========================================================
   COLLISION
========================================================= */

function rectCollision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (!gameRunning || ytPaused) {
        return;
    }


    /*
        Prevent giant time jump.
    */

    dt =
        Math.min(
            dt,
            0.05
        );


    /* ---------------- TIME ---------------- */

    gameTime -= dt;

    if (gameTime <= 0) {

        gameTime = 0;

        winGame();

        return;
    }


    /* ---------------- PLAYER ---------------- */

    let direction = 0;

    if (keys.left) {
        direction -= 1;
    }

    if (keys.right) {
        direction += 1;
    }

    player.x +=
        direction *
        player.speed *
        dt;

    const half =
        player.width / 2;

    player.x =
        Math.max(
            half,
            Math.min(
                W - half,
                player.x
            )
        );


    if (player.invincibleTimer > 0) {

        player.invincibleTimer -= dt;
    }


    /* ---------------- BULLET POWER ---------------- */

    if (bulletsPowerTimer > 0) {

        bulletsPowerTimer -= dt;

        if (bulletsPowerTimer <= 0) {

            bulletsPower = 1;

            bulletsPowerTimer = 0;
        }
    }


    /* ---------------- SHIELD ---------------- */

    if (shieldTimer > 0) {

        shieldTimer -= dt;

        if (shieldTimer <= 0) {

            shieldActive = false;

            shieldTimer = 0;
        }
    }


    /* ---------------- SHOOT ---------------- */

    shootTimer -= dt;

    if (shootTimer <= 0) {

        shoot();

        /*
            ORIGINAL FIRE TIMING PRESERVED
        */

        if (bulletsPower >= 4) {

            shootTimer = 0.23;

        } else if (bulletsPower === 3) {

            shootTimer = 0.27;

        } else if (bulletsPower === 2) {

            shootTimer = 0.30;

        } else {

            shootTimer = 0.34;
        }
    }


    /* ---------------- OBSTACLE SPAWN ---------------- */

    obstacleTimer -= dt;

    if (obstacleTimer <= 0) {

        spawnObstacle();

        obstacleTimer =
            0.55 +
            Math.random() * 0.5;
    }


    /* ---------------- RANDOM POWER UP ---------------- */

    if (
        Math.random() <
        0.0009
    ) {

        spawnPowerUp();
    }


    /* ---------------- BULLETS ---------------- */

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        bullet.x +=
            bullet.vx * dt;

        bullet.y +=
            bullet.vy * dt;


        if (
            bullet.y < -30 ||
            bullet.x < -50 ||
            bullet.x > W + 50
        ) {

            bullets.splice(i, 1);

            continue;
        }


        let bulletHit = false;


        for (
            let j = obstacles.length - 1;
            j >= 0;
            j--
        ) {

            const obstacle =
                obstacles[j];


            const bulletBox = {

                x:
                    bullet.x - 4,

                y:
                    bullet.y - 9,

                width: 8,

                height: 18
            };


            if (
                rectCollision(
                    bulletBox,
                    obstacle
                )
            ) {

                obstacle.hp--;

                createParticles(
                    bullet.x,
                    bullet.y,
                    3
                );

                bullets.splice(i, 1);

                bulletHit = true;


                if (
                    obstacle.hp <= 0
                ) {

                    score +=
                        obstacle.maxHp * 10;

                    combo++;

                    createParticles(
                        obstacle.x +
                        obstacle.width / 2,

                        obstacle.y +
                        obstacle.height / 2,

                        14
                    );

                    obstacles.splice(
                        j,
                        1
                    );
                }

                break;
            }
        }


        if (bulletHit) {
            continue;
        }
    }


    /* ---------------- OBSTACLES ---------------- */

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];

        obstacle.y +=
            obstacle.speed *
            dt;


        if (
            obstacle.y >
            H + 50
        ) {

            obstacles.splice(i, 1);

            combo = 0;

            continue;
        }


        const playerBox = {

            x:
                player.x -
                player.width / 2,

            y:
                player.y -
                player.height / 2,

            width:
                player.width,

            height:
                player.height
        };


        if (
            rectCollision(
                playerBox,
                obstacle
            )
        ) {

            if (
                shieldActive
            ) {

                shieldActive = false;
                shieldTimer = 0;

                createParticles(
                    obstacle.x +
                    obstacle.width / 2,

                    obstacle.y +
                    obstacle.height / 2,

                    12
                );

                obstacles.splice(
                    i,
                    1
                );

            } else if (
                player.invincibleTimer <= 0
            ) {

                lives--;

                player.invincibleTimer =
                    1.2;

                combo = 0;

                createParticles(
                    player.x,
                    player.y,
                    18
                );

                obstacles.splice(
                    i,
                    1
                );


                if (lives <= 0) {

                    endGame();

                    return;
                }
            }
        }
    }


    /* ---------------- POWER UPS ---------------- */

    for (
        let i = powerUps.length - 1;
        i >= 0;
        i--
    ) {

        const power =
            powerUps[i];

        power.y +=
            power.speed *
            dt;


        if (
            power.y >
            H + 40
        ) {

            powerUps.splice(i, 1);

            continue;
        }


        const powerBox = {

            x:
                power.x -
                power.size,

            y:
                power.y -
                power.size,

            width:
                power.size * 2,

            height:
                power.size * 2
        };


        const playerBox = {

            x:
                player.x -
                player.width / 2,

            y:
                player.y -
                player.height / 2,

            width:
                player.width,

            height:
                player.height
        };


        if (
            rectCollision(
                playerBox,
                powerBox
            )
        ) {

            if (
                power.type === "bullet"
            ) {

                bulletsPower =
                    Math.min(
                        4,
                        bulletsPower + 1
                    );

                bulletsPowerTimer =
                    10;

            } else {

                shieldActive = true;

                shieldTimer = 6;
            }


            score += 25;

            createParticles(
                power.x,
                power.y,
                12
            );

            powerUps.splice(
                i,
                1
            );
        }
    }


    /* ---------------- PARTICLES ---------------- */

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];

        particle.x +=
            particle.vx *
            dt;

        particle.y +=
            particle.vy *
            dt;

        particle.life -= dt;


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }


    /* ---------------- BEST SCORE ---------------- */

    if (score > best) {

        best =
            Math.floor(score);

        saveLocalBestScore(best);
    }


    updateHUD();
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    if (!gameRunning) {
        return;
    }

    gameRunning = false;

    score =
        Math.floor(
            Math.max(
                0,
                score
            )
        );

    if (score > best) {

        best = score;

        saveLocalBestScore(best);
    }


    /*
        Send final integer score.
    */

    sendFinalScore();

    /*
        Save best score to Playables cloud.
    */

    saveCloudData();


    overlayTitle.textContent =
        "GAME OVER";

    finalScoreEl.textContent =
        "SCORE: " + score;

    bestScoreFinalEl.textContent =
        "BEST: " + best;

    overlay.classList.add("show");

    updateHUD();
}


/* =========================================================
   WIN GAME
========================================================= */

function winGame() {

    if (!gameRunning) {
        return;
    }

    gameRunning = false;

    score += 500;

    score =
        Math.floor(
            Math.max(
                0,
                score
            )
        );


    if (score > best) {

        best = score;

        saveLocalBestScore(best);
    }


    /*
        Send final integer score.
    */

    sendFinalScore();

    /*
        Save cloud data.
    */

    saveCloudData();


    overlayTitle.textContent =
        "YOU SURVIVED!";

    finalScoreEl.textContent =
        "SCORE: " + score;

    bestScoreFinalEl.textContent =
        "BEST: " + best;

    overlay.classList.add("show");

    updateHUD();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    scoreEl.textContent =
        Math.floor(score);

    bestEl.textContent =
        Math.floor(best);

    timeEl.textContent =
        Math.ceil(gameTime);

    livesEl.textContent =
        lives;

    bulletPowerEl.textContent =
        bulletsPower;

    shieldStatusEl.textContent =
        shieldActive
            ? Math.ceil(shieldTimer) + "s"
            : "OFF";
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#050816";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Subtle grid
    */

    ctx.strokeStyle =
        "rgba(70,130,200,0.08)";

    ctx.lineWidth = 1;

    const grid = 50;

    for (
        let x = 0;
        x <= W;
        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }

    for (
        let y = 0;
        y <= H;
        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    if (
        player.invincibleTimer > 0
    ) {

        ctx.globalAlpha =
            0.45 +
            Math.sin(
                performance.now() * 0.02
            ) * 0.25;
    }


    /*
        Ship body
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -22
    );

    ctx.lineTo(
        -24,
        18
    );

    ctx.lineTo(
        0,
        10
    );

    ctx.lineTo(
        24,
        18
    );

    ctx.closePath();

    ctx.fillStyle =
        "#1687ff";

    ctx.fill();

    ctx.strokeStyle =
        "#8fd7ff";

    ctx.lineWidth = 2;

    ctx.stroke();


    /*
        Core
    */

    ctx.beginPath();

    ctx.arc(
        0,
        1,
        7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    /*
        Shield
    */

    if (shieldActive) {

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            34,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "#73f6ff";

        ctx.lineWidth = 3;

        ctx.globalAlpha =
            0.75;

        ctx.stroke();
    }


    ctx.restore();
}


/* =========================================================
   DRAW BULLETS
========================================================= */

function drawBullets() {

    for (
        const bullet of bullets
    ) {

        ctx.save();

        ctx.beginPath();

        ctx.moveTo(
            bullet.x,
            bullet.y + 8
        );

        ctx.lineTo(
            bullet.x,
            bullet.y - 8
        );

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 4;

        ctx.shadowBlur = 12;

        ctx.shadowColor =
            "#48aaff";

        ctx.stroke();

        ctx.restore();
    }
}


/* =========================================================
   DRAW OBSTACLES
========================================================= */

function drawObstacles() {

    for (
        const obstacle of obstacles
    ) {

        ctx.save();


        /*
            Red numbered hurdle
        */

        ctx.fillStyle =
            "#e53935";

        ctx.strokeStyle =
            "#ff8a80";

        ctx.lineWidth = 2;


        /*
            roundRect fallback
            for compatibility
        */

        ctx.beginPath();

        if (
            typeof ctx.roundRect ===
            "function"
        ) {

            ctx.roundRect(
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height,
                8
            );

        } else {

            ctx.rect(
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );
        }

        ctx.fill();

        ctx.stroke();


        /*
            Number
        */

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 22px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            obstacle.hp,
            obstacle.x +
            obstacle.width / 2,

            obstacle.y +
            obstacle.height / 2
        );


        ctx.restore();
    }
}


/* =========================================================
   DRAW POWER UPS
========================================================= */

function drawPowerUps() {

    for (
        const power of powerUps
    ) {

        ctx.save();

        ctx.translate(
            power.x,
            power.y
        );


        if (
            power.type === "bullet"
        ) {

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                power.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#1687ff";

            ctx.fill();

            ctx.strokeStyle =
                "#b9e6ff";

            ctx.lineWidth = 2;

            ctx.stroke();


            ctx.fillStyle =
                "#ffffff";

            ctx.font =
                "bold 18px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "+",
                0,
                0
            );

        } else {

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                power.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#28e7ff";

            ctx.fill();

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth = 2;

            ctx.stroke();


            ctx.fillStyle =
                "#ffffff";

            ctx.font =
                "bold 16px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "S",
                0,
                0
            );
        }

        ctx.restore();
    }
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

    for (
        const particle of particles
    ) {

        ctx.save();

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life
            );

        ctx.fillStyle =
            "#6cc8ff";

        ctx.fillRect(
            particle.x,
            particle.y,
            3,
            3
        );

        ctx.restore();
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();

    drawPowerUps();

    drawObstacles();

    drawBullets();

    drawParticles();

    drawPlayer();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now) {

    const dt =
        (now - lastTime) /
        1000;

    lastTime = now;

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keys.left = true;

            event.preventDefault();
        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keys.right = true;

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            keys.left = false;
        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            keys.right = false;
        }
    }
);


/* =========================================================
   MOBILE CONTROLS
========================================================= */

function holdButton(
    button,
    direction
) {

    button.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            keys[direction] = true;
        }
    );


    button.addEventListener(
        "pointerup",
        function(event) {

            event.preventDefault();

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        function() {

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointerleave",
        function() {

            keys[direction] = false;
        }
    );
}


holdButton(
    document.getElementById("leftBtn"),
    "left"
);

holdButton(
    document.getElementById("rightBtn"),
    "right"
);


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
    "click",
    function() {

        resetGame();

        lastTime =
            performance.now();
    }
);


/* =========================================================
   VISIBILITY SAFETY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {

            ytPaused = true;

            saveCloudData();

        } else {

            ytPaused = false;

            lastTime =
                performance.now();
        }
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

player =
    createPlayer();

best =
    getLocalBestScore();

updateHUD();

setupPlayables();

draw();


/*
    Tell YouTube that the first frame is available,
    then game is ready.

    The game itself is already interactable.
*/

requestAnimationFrame(
    function() {

        notifyPlayablesReady();

        /*
            Load cloud data AFTER readiness so
            gameReady is not delayed by cloud API.
        */

        loadCloudData();
    }
);


/*
    Start game loop.
*/

requestAnimationFrame(
    gameLoop
);
</script>
